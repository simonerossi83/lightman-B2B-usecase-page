<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Quattro progetti Lightman Digital Show: il contesto, la personalizzazione e la realizzazione di spettacoli per eventi.">
  <meta name="theme-color" content="#111210">
  <title>Progetti e produzioni | Lightman Digital Show</title>
  <link rel="stylesheet" href="style.css">
  <script src="case-studies.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#progetti">Vai ai progetti</a>
  <header class="header page-width">
    <a class="brand" href="https://lightman.it/" aria-label="Lightman Digital Show, sito ufficiale">
      <img src="assets/logo.png" alt="Lightman Digital Show" width="160" height="60">
    </a>
  </header>

  <main class="page-width" id="inizio">
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">Progetti e<br>produzioni</h1>
      <p>Quattro progetti, quattro contesti diversi.<br> Dalle richieste iniziali alla realizzazione dello spettacolo.</p>
    </section>

    <section class="projects" id="progetti" aria-labelledby="projects-title" tabindex="-1">
      <div class="projects-heading">
        <h2 id="projects-title">I progetti</h2>
        <span>01 — 04</span>
      </div>
      <div class="case-grid" id="case-grid"></div>
      <noscript><p class="fallback-note">Per consultare i quattro progetti e i relativi approfondimenti, abilita JavaScript nel browser.</p></noscript>
    </section>
  </main>

  <footer class="footer page-width">
    <span>Lightman Digital Show</span>
    <div class="footer-contacts">
      <a href="tel:+393462201020">346 220 1020</a>
      <a href="mailto:info@lightman.it">info@lightman.it</a>
    </div>
  </footer>

  <dialog class="project-dialog" id="project-dialog" aria-labelledby="project-title" aria-modal="true">
    <div class="dialog-toolbar">
      <span>Portfolio <span aria-hidden="true">/</span> <span id="project-number"></span></span>
      <button class="dialog-close" type="button" aria-label="Chiudi approfondimento" autofocus>
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <article id="project-content"></article>
  </dialog>

  <template id="case-card-template">
    <article class="case-card">
      <button class="case-open" type="button" aria-haspopup="dialog" aria-controls="project-dialog">
        <span class="case-image">
          <img width="1920" height="1080" decoding="async" alt="">
          <span class="image-action" aria-hidden="true">↗</span>
        </span>
      </button>
      <p class="case-meta"><span class="case-number"></span><span class="case-type"></span></p>
      <h3 class="case-title"></h3>
      <p class="case-description"></p>
    </article>
  </template>
</body>
</html>
